<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Calorie Calculator</title>

    <style>
        :root {
            --bg1: #0b3a88;
            --bg2: #0b8aa0;
            --card: rgba(255,255,255,.12);
            --stroke: rgba(255,255,255,.18);
            --text: #ffffff;
            --muted: rgba(255,255,255,.75);
            --btn: #2a7bff;
            --btn2: #5b6472;
            --error: #ff4d4d;
            --ok: #21d07a;
            --fieldBg: rgba(255,255,255,.92);
            --fieldText: #111; /* داخل الحقول أسود */
        }

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
            color: var(--text);
            background: radial-gradient(1100px 600px at 20% 10%, #1a6bff 0%, transparent 60%), linear-gradient(135deg, var(--bg1), var(--bg2));
        }

        .wrap {
            width: min(980px, 100%);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: .3px;
        }

        .sub {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 16px;
        }

        .langBox {
            background: rgba(255,255,255,.14);
            border: 1px solid var(--stroke);
            border-radius: 999px;
            padding: 6px;
            display: flex;
            gap: 6px;
            align-items: center;
            backdrop-filter: blur(10px);
            height: 44px;
        }

        .langBtn {
            border: 0;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            background: transparent;
            color: var(--text);
            font-weight: 700;
            opacity: .8;
        }

            .langBtn.active {
                background: rgba(255,255,255,.22);
                opacity: 1;
            }

        .card {
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 18px;
            padding: 18px;
            display: grid;
            grid-template-columns: 1.2fr .8fr;
            gap: 16px;
            backdrop-filter: blur(12px);
        }

        .panel {
            background: rgba(0,0,0,.08);
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 16px;
            padding: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-weight: 700;
            margin: 0 0 6px;
            color: rgba(255,255,255,.9);
        }

        input, select {
            width: 100%;
            padding: 12px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.18);
            outline: none;
            background: var(--fieldBg);
            color: var(--fieldText); /* نص داخل الحقول أسود */
            font-size: 16px;
        }

        /* مهم جداً: لون نص الخيارات داخل القائمة */
        select, option {
            color: #111;
            background: #fff;
        }

        input::placeholder {
            color: #777;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            border: 0;
            border-radius: 12px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: 800;
            color: #fff;
            background: var(--btn);
        }

            .btn.gray {
                background: var(--btn2);
            }

        .note {
            margin-top: 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .msg {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            display: none;
            font-weight: 700;
        }

            .msg.error {
                display: none;
                background: rgba(255,77,77,.18);
                border: 1px solid rgba(255,77,77,.4);
                color: #ffd4d4;
            }

            .msg.success {
                display: none;
                background: rgba(33,208,122,.18);
                border: 1px solid rgba(33,208,122,.35);
                color: #d7ffe9;
            }

        .resultBox {
            display: grid;
            gap: 12px;
        }

        .resultTitle {
            font-weight: 900;
            font-size: 18px;
            margin: 0 0 6px;
        }

        .rItem {
            background: rgba(255,255,255,.10);
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }

            .rItem span {
                color: rgba(255,255,255,.85);
                font-weight: 700;
            }

        .rVal {
            font-weight: 900;
            font-size: 18px;
        }

        .foot {
            margin-top: 8px;
            font-size: 12px;
            color: rgba(255,255,255,.7);
        }

        @media (max-width: 820px) {
            .card {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 34px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="top">
            <div>
                <h1 id="title">Daily Calorie Calculator</h1>
                <div class="sub" id="subtitle">Enter your data to calculate daily calories</div>
            </div>

            <div class="langBox" aria-label="Language">
                <button class="langBtn active" id="btnEn" type="button">English</button>
                <button class="langBtn" id="btnAr" type="button">العربية</button>
            </div>
        </div>

        <div class="card">
            <!-- Left: inputs -->
            <div class="panel">
                <div class="grid">
                    <div>
                        <label id="l_weight" for="weight">Weight (kg)</label>
                        <input id="weight" type="number" inputmode="decimal" min="1" placeholder="e.g. 58" />
                    </div>

                    <div>
                        <label id="l_height" for="height">Height (cm)</label>
                        <input id="height" type="number" inputmode="decimal" min="1" placeholder="e.g. 164" />
                    </div>

                    <div>
                        <label id="l_age" for="age">Age</label>
                        <input id="age" type="number" inputmode="numeric" min="1" placeholder="e.g. 20" />
                    </div>

                    <div>
                        <label id="l_sex" for="sex">Sex</label>
                        <select id="sex">
                            <option value="" id="optSex">— Select —</option>
                            <option value="F" id="optFemale">Female</option>
                            <option value="M" id="optMale">Male</option>
                        </select>
                    </div>

                    <div>
                        <label id="l_activity" for="activity">Activity Level</label>
                        <select id="activity">
                            <option value="" id="optActivity">— Select —</option>
                            <option value="1.2" id="act1">Sedentary</option>
                            <option value="1.375" id="act2">Light</option>
                            <option value="1.55" id="act3">Moderate</option>
                            <option value="1.725" id="act4">Very Active</option>
                            <option value="1.9" id="act5">Extra Active</option>
                        </select>
                    </div>

                    <div>
                        <label id="l_goal" for="goal">Goal</label>
                        <select id="goal">
                            <option value="" id="optGoal">— Select —</option>
                            <option value="lose" id="g1">Lose weight</option>
                            <option value="maintain" id="g2">Maintain</option>
                            <option value="gain" id="g3">Gain weight</option>
                        </select>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn" id="calcBtn" type="button">Calculate</button>
                    <button class="btn gray" id="resetBtn" type="button">Reset</button>
                </div>

                <div class="note" id="smallNote">
                    We use Mifflin-St Jeor to estimate BMR, then multiply by activity.
                </div>

                <div class="msg error" id="errMsg">Please fill all fields</div>
                <div class="msg success" id="okMsg">Done</div>
            </div>

            <!-- Right: results -->
            <div class="panel">
                <div class="resultTitle" id="r_title">Result</div>

                <div class="resultBox">
                    <div class="rItem">
                        <span id="r_dailyLabel">Daily Calories</span>
                        <div class="rVal" id="dailyOut">—</div>
                    </div>

                    <div class="rItem">
                        <span id="r_bmrLabel">BMR</span>
                        <div class="rVal" id="bmrOut">—</div>
                    </div>

                    <div class="rItem">
                        <span id="r_noteLabel">Note</span>
                        <div class="rVal" id="noteOut">—</div>
                    </div>
                </div>

                <div class="foot" id="footText">
                    This is an estimate, not medical advice.
                </div>
            </div>
        </div>
    </div>

    <script>
        // ====== Language data ======
        let lang = "en";

        const T = {
            en: {
                title: "Daily Calorie Calculator",
                sub: "Enter your data to calculate daily calories",

                w: "Weight (kg)",
                h: "Height (cm)",
                a: "Age",
                s: "Sex",
                act: "Activity Level",
                goal: "Goal",

                calc: "Calculate",
                reset: "Reset",

                err: "Please fill all fields",

                optSelect: "— Select —",
                female: "Female",
                male: "Male",

                act1: "Sedentary",
                act2: "Light",
                act3: "Moderate",
                act4: "Very Active",
                act5: "Extra Active",

                g1: "Lose weight",
                g2: "Maintain",
                g3: "Gain weight",

                noteSmall: "We use Mifflin-St Jeor to estimate BMR, then multiply by activity.",

                rTitle: "Result",
                rDaily: "Daily Calories",
                rBmr: "BMR",
                rNote: "Note",
                foot: "This is an estimate, not medical advice.",

                noteLose: "Includes ~15% deficit (weight loss).",
                noteMaintain: "Maintenance calories estimate.",
                noteGain: "Includes ~10% surplus (weight gain)."
            },
            ar: {
                title: "حاسبة السعرات اليومية",
                sub: "ادخلي بياناتك لحساب احتياجك اليومي من السعرات",

                w: "الوزن (كجم)",
                h: "الطول (سم)",
                a: "العمر",
                s: "الجنس",
                act: "مستوى النشاط",
                goal: "الهدف",

                calc: "احسب",
                reset: "تفريغ",

                err: "الرجاء تعبئة جميع الحقول",

                optSelect: "— اختر —",
                female: "أنثى",
                male: "ذكر",

                act1: "خامل",
                act2: "خفيف",
                act3: "متوسط",
                act4: "نشط",
                act5: "نشط جداً",

                g1: "نزول وزن",
                g2: "ثبات",
                g3: "زيادة وزن",

                noteSmall: "نستخدم معادلة Mifflin-St Jeor لحساب BMR ثم نضربه بمستوى النشاط.",

                rTitle: "النتيجة",
                rDaily: "السعرات اليومية",
                rBmr: "BMR",
                rNote: "ملاحظة",
                foot: "هذه نتيجة تقديرية وليست نصيحة طبية.",

                noteLose: "يتضمن عجز تقريباً 15% (لنزول الوزن).",
                noteMaintain: "تقدير سعرات الثبات.",
                noteGain: "يتضمن زيادة تقريباً 10% (لزيادة الوزن)."
            }
        };

        // ====== Elements ======
        const title = document.getElementById("title");
        const subtitle = document.getElementById("subtitle");

        const l_weight = document.getElementById("l_weight");
        const l_height = document.getElementById("l_height");
        const l_age = document.getElementById("l_age");
        const l_sex = document.getElementById("l_sex");
        const l_activity = document.getElementById("l_activity");
        const l_goal = document.getElementById("l_goal");

        const weight = document.getElementById("weight");
        const height = document.getElementById("height");
        const age = document.getElementById("age");
        const sex = document.getElementById("sex");
        const activity = document.getElementById("activity");
        const goal = document.getElementById("goal");

        const btnEn = document.getElementById("btnEn");
        const btnAr = document.getElementById("btnAr");

        const calcBtn = document.getElementById("calcBtn");
        const resetBtn = document.getElementById("resetBtn");

        const errMsg = document.getElementById("errMsg");
        const okMsg = document.getElementById("okMsg");
        const smallNote = document.getElementById("smallNote");

        const r_title = document.getElementById("r_title");
        const r_dailyLabel = document.getElementById("r_dailyLabel");
        const r_bmrLabel = document.getElementById("r_bmrLabel");
        const r_noteLabel = document.getElementById("r_noteLabel");
        const footText = document.getElementById("footText");

        const dailyOut = document.getElementById("dailyOut");
        const bmrOut = document.getElementById("bmrOut");
        const noteOut = document.getElementById("noteOut");

        // Options that must switch with language
        const optSex = document.getElementById("optSex");
        const optFemale = document.getElementById("optFemale");
        const optMale = document.getElementById("optMale");

        const optActivity = document.getElementById("optActivity");
        const act1 = document.getElementById("act1");
        const act2 = document.getElementById("act2");
        const act3 = document.getElementById("act3");
        const act4 = document.getElementById("act4");
        const act5 = document.getElementById("act5");

        const optGoal = document.getElementById("optGoal");
        const g1 = document.getElementById("g1");
        const g2 = document.getElementById("g2");
        const g3 = document.getElementById("g3");

        // ====== Helpers ======
        function setActiveLangButtons() {
            btnEn.classList.toggle("active", lang === "en");
            btnAr.classList.toggle("active", lang === "ar");
        }

        function applyLang() {
            const t = T[lang];

            // RTL/LTR
            document.documentElement.lang = lang;
            document.body.dir = (lang === "ar") ? "rtl" : "ltr";

            title.innerText = t.title;
            subtitle.innerText = t.sub;

            l_weight.innerText = t.w;
            l_height.innerText = t.h;
            l_age.innerText = t.a;
            l_sex.innerText = t.s;
            l_activity.innerText = t.act;
            l_goal.innerText = t.goal;

            calcBtn.innerText = t.calc;
            resetBtn.innerText = t.reset;

            errMsg.innerText = t.err;

            smallNote.innerText = t.noteSmall;

            r_title.innerText = t.rTitle;
            r_dailyLabel.innerText = t.rDaily;
            r_bmrLabel.innerText = t.rBmr;
            r_noteLabel.innerText = t.rNote;
            footText.innerText = t.foot;

            // placeholders (اختياري)
            weight.placeholder = (lang === "ar") ? "مثال: 58" : "e.g. 58";
            height.placeholder = (lang === "ar") ? "مثال: 164" : "e.g. 164";
            age.placeholder = (lang === "ar") ? "مثال: 20" : "e.g. 20";

            // SELECT defaults + options
            optSex.innerText = t.optSelect;
            optFemale.innerText = t.female;
            optMale.innerText = t.male;

            optActivity.innerText = t.optSelect;
            act1.innerText = t.act1;
            act2.innerText = t.act2;
            act3.innerText = t.act3;
            act4.innerText = t.act4;
            act5.innerText = t.act5;

            optGoal.innerText = t.optSelect;
            g1.innerText = t.g1;
            g2.innerText = t.g2;
            g3.innerText = t.g3;

            setActiveLangButtons();
        }

        function showError() {
            okMsg.style.display = "none";
            errMsg.style.display = "block";
        }

        function hideMessages() {
            errMsg.style.display = "none";
            okMsg.style.display = "none";
        }

        function resetAll() {
            weight.value = "";
            height.value = "";
            age.value = "";
            sex.value = "";
            activity.value = "";
            goal.value = "";

            dailyOut.innerText = "—";
            bmrOut.innerText = "—";
            noteOut.innerText = "—";

            hideMessages();
        }

        function validate() {
            const w = weight.value.trim();
            const h = height.value.trim();
            const a = age.value.trim();
            const s = sex.value;
            const act = activity.value;
            const g = goal.value;
            return (w !== "" && h !== "" && a !== "" && s !== "" && act !== "" && g !== "");
        }

        function calculate() {
            hideMessages();

            if (!validate()) {
                showError();
                return;
            }

            const w = Number(weight.value);
            const h = Number(height.value);
            const a = Number(age.value);
            const s = sex.value;                // "F" or "M"
            const act = Number(activity.value); // 1.2 ...
            const g = goal.value;               // lose/maintain/gain

            // Mifflin-St Jeor BMR
            let bmr = 10 * w + 6.25 * h - 5 * a + (s === "M" ? 5 : -161);

            // Daily calories (TDEE)
            let tdee = bmr * act;

            // Goal adjustment
            let note = "—";
            if (g === "lose") {
                tdee = tdee * 0.85; // -15%
                note = T[lang].noteLose;
            } else if (g === "maintain") {
                note = T[lang].noteMaintain;
            } else if (g === "gain") {
                tdee = tdee * 1.10; // +10%
                note = T[lang].noteGain;
            }

            bmrOut.innerText = Math.round(bmr);
            dailyOut.innerText = Math.round(tdee);
            noteOut.innerText = note;

            okMsg.style.display = "block";
            okMsg.className = "msg success";
            okMsg.innerText = (lang === "ar") ? "تم الحساب بنجاح" : "Calculated successfully";
        }

        // ====== Events ======
        btnEn.addEventListener("click", () => { lang = "en"; applyLang(); });
        btnAr.addEventListener("click", () => { lang = "ar"; applyLang(); });

        calcBtn.addEventListener("click", calculate);
        resetBtn.addEventListener("click", resetAll);

        // Start
        applyLang();
        resetAll();
    </script>
</body>
</html>
